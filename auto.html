<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehículo | San Cristóbal Car House</title><style>
:root{--ink:#111210;--paper:#f8f6f0;--cream:#f1eee5;--line:#d9d5cb;--muted:#73746d;--acid:#d9ff46}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}.shell{width:min(1180px,calc(100% - 40px));margin:auto}.head{background:var(--ink);color:#fff}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;font-weight:800;letter-spacing:.16em}.back{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#c5c4ba}.top{padding:60px 0 30px;display:flex;justify-content:space-between;gap:30px;align-items:end}.top h1{font:400 clamp(45px,6vw,72px)/.95 Georgia,serif;margin:0;letter-spacing:-.045em}.top p{color:var(--muted)}.price{font-size:28px;font-weight:800}.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:260px 260px;gap:6px}.shot{position:relative;overflow:hidden;background:#1b1c19;cursor:zoom-in}.shot:first-child{grid-row:1/3}.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.shot:hover img{transform:scale(1.015)}.all-badge{position:absolute;right:14px;bottom:14px;background:rgba(17,18,16,.88);color:#fff;border:1px solid rgba(255,255,255,.35);padding:10px 12px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.detail{display:grid;grid-template-columns:1fr 340px;gap:70px;padding:60px 0 90px}.desc{font-size:16px;line-height:1.75;color:#5d5e57}.specs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:35px}.spec{padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.spec span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}.contact{background:#eae7de;padding:28px;height:max-content;position:sticky;top:20px}.contact h2{font:400 30px Georgia,serif;margin:0}.btn{display:flex;margin-top:22px;background:var(--ink);color:#fff;min-height:50px;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.state{padding:80px 0;font:400 34px Georgia,serif}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,9,8,.97);display:none;flex-direction:column;color:#fff;overflow:hidden}.lightbox.open{display:flex}.lb-top{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #333}.lb-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c2c2b8}.lb-close{background:none;border:0;color:#fff;font-size:28px;cursor:pointer}.lb-main{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:22px 80px}.lb-main img{display:block;width:auto;height:auto;max-width:min(82vw,1400px);max-height:calc(100vh - 195px);object-fit:contain}.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid #555;background:rgba(0,0,0,.25);color:#fff;font-size:25px;cursor:pointer}.lb-prev{left:18px}.lb-next{right:18px}.lb-bottom{flex:0 0 105px;border-top:1px solid #333;padding:10px 18px 14px;background:#0b0c0a}.lb-count{text-align:center;font-size:10px;color:#aaa;margin-bottom:8px}.thumbs{display:flex;gap:8px;overflow-x:auto;justify-content:center;max-width:100%;padding-bottom:2px}.thumbs button{padding:0;border:2px solid transparent;background:none;cursor:pointer;flex:0 0 auto}.thumbs button.active{border-color:var(--acid)}.thumbs img{width:78px;height:55px;object-fit:cover;display:block}
@media(max-width:800px){.top{display:block}.price{margin-top:20px}.gallery{grid-template-columns:1fr 1fr;grid-template-rows:250px 130px}.shot:first-child{grid-column:1/3;grid-row:auto}.detail{grid-template-columns:1fr}.contact{position:static}.specs{grid-template-columns:1fr 1fr}.lb-main{padding:14px 52px}.lb-main img{max-width:88vw;max-height:calc(100vh - 190px)}.thumbs{justify-content:flex-start}}@media(max-width:520px){.shell{width:calc(100% - 28px)}.gallery{grid-template-columns:1fr;grid-template-rows:300px}.shot:first-child{grid-column:auto}.shot:nth-child(n+2){display:none}.all-badge{display:block}.lb-top{height:54px;flex-basis:54px;padding:0 16px}.lb-main{padding:10px 40px}.lb-main img{max-width:86vw;max-height:calc(100vh - 175px)}.lb-nav{width:36px;height:36px}.lb-prev{left:6px}.lb-next{right:6px}.lb-bottom{flex-basis:92px;padding:8px 10px 10px}.thumbs img{width:64px;height:46px}}
</style></head><body><header class="head"><div class="shell nav"><a href="/" class="brand">SAN CRISTÓBAL · CAR HOUSE</a><a href="/#stock" class="back">← Volver al inventario</a></div></header><main class="shell" id="app"><div class="state">Cargando vehículo…</div></main>
<div id="lightbox" class="lightbox" aria-hidden="true"><div class="lb-top"><div id="lbTitle" class="lb-title"></div><button id="lbClose" class="lb-close" aria-label="Cerrar">×</button></div><div class="lb-main"><button id="lbPrev" class="lb-nav lb-prev" aria-label="Anterior">‹</button><img id="lbImg" alt=""><button id="lbNext" class="lb-nav lb-next" aria-label="Siguiente">›</button></div><div class="lb-bottom"><div id="lbCount" class="lb-count"></div><div id="thumbs" class="thumbs"></div></div></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.117.1';
const s=createClient('https://hljeiqgrumtlukdvaspz.supabase.co','sb_publishable_gUvMtgIyXLAwuYFOTV6z-Q_KKpevr63');const sid=(()=>{let x=localStorage.getItem('scch_sid');if(!x){x=crypto.randomUUID();localStorage.setItem('scch_sid',x)}return x})();const track=(event_type,vehicle_id=null,source='')=>{s.from('analytics_events').insert({event_type,vehicle_id,source,path:location.pathname,session_id:sid,metadata:{referrer:document.referrer||null}}).then(()=>{}).catch(()=>{})};
const id=new URLSearchParams(location.search).get('id');const money=c=>c.price==null?'Consultar':new Intl.NumberFormat('es-AR',{style:'currency',currency:c.currency||'USD',maximumFractionDigits:0}).format(Number(c.price));const km=n=>new Intl.NumberFormat('es-AR').format(n||0)+' km';const{data:c,error}=await s.from('vehicles').select('*').eq('id',id).eq('published',true).maybeSingle();
let allImages=[],current=0;
function uniqueImages(c){const arr=[...(c.images||[])];if(c.cover_image&&!arr.includes(c.cover_image))arr.unshift(c.cover_image);return arr.filter(Boolean)}
function openLightbox(i=0){if(!allImages.length)return;current=i;document.querySelector('#lightbox').classList.add('open');document.querySelector('#lightbox').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';paintLightbox()}
function closeLightbox(){document.querySelector('#lightbox').classList.remove('open');document.querySelector('#lightbox').setAttribute('aria-hidden','true');document.body.style.overflow=''}
function paintLightbox(){document.querySelector('#lbImg').src=allImages[current];document.querySelector('#lbCount').textContent=`Foto ${current+1} de ${allImages.length}`;document.querySelectorAll('[data-thumb]').forEach((b,i)=>b.classList.toggle('active',i===current));document.querySelector('#lbPrev').style.visibility=allImages.length>1?'visible':'hidden';document.querySelector('#lbNext').style.visibility=allImages.length>1?'visible':'hidden'}
function step(d){if(!allImages.length)return;current=(current+d+allImages.length)%allImages.length;paintLightbox()}
if(error||!c){document.querySelector('#app').innerHTML='<div class="state">La publicación no está disponible.</div>'}else{document.title=`${c.brand} ${c.model} | San Cristóbal Car House`;allImages=uniqueImages(c);const visible=allImages.slice(0,3);const wa=`https://wa.me/5491138487025?text=${encodeURIComponent(`Hola, quiero consultar por el ${c.brand} ${c.model} ${c.version||''} ${c.year} publicado en la web.`)}`;document.querySelector('#app').innerHTML=`<section class="top"><div><p>${c.status==='reserved'?'RESERVADO · ':''}${c.year}${c.version?' · '+c.version:''}</p><h1>${c.brand} ${c.model}</h1></div><div class="price">${money(c)}</div></section>${allImages.length?`<div class="gallery">${visible.map((x,i)=>`<div class="shot" data-photo="${i}"><img src="${x}" alt="${c.brand} ${c.model} - foto ${i+1}">${i===visible.length-1&&allImages.length>3?`<span class="all-badge">Ver todas · ${allImages.length}</span>`:''}</div>`).join('')}</div>`:''}<section class="detail"><div><p class="desc">${c.description||'Consultanos por más información sobre esta unidad.'}</p><div class="specs">${[['Kilómetros',km(c.kilometers)],['Motor',c.engine||'—'],['Transmisión',c.transmission||'—'],['Combustible',c.fuel||'—'],['Color',c.color||'—'],['Ubicación',c.location||'Buenos Aires']].map(x=>`<div class="spec"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><aside class="contact"><h2>¿Te interesa esta unidad?</h2><p>Escribinos y coordinamos para verla o resolver cualquier consulta.</p><a class="btn" id="waInquiry" href="${wa}" target="_blank">Consultar por WhatsApp</a></aside></section>`;track('vehicle_view',c.id,'detail');document.querySelector('#waInquiry').onclick=()=>track('whatsapp_click',c.id,'vehicle_detail');document.querySelectorAll('[data-photo]').forEach(el=>el.onclick=()=>openLightbox(Number(el.dataset.photo)));document.querySelector('#lbTitle').textContent=`${c.brand} ${c.model} · ${c.year}`;document.querySelector('#thumbs').innerHTML=allImages.map((x,i)=>`<button data-thumb="${i}" aria-label="Ver foto ${i+1}"><img src="${x}" alt=""></button>`).join('');document.querySelectorAll('[data-thumb]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.thumb);paintLightbox()})}
document.querySelector('#lbClose').onclick=closeLightbox;document.querySelector('#lbPrev').onclick=()=>step(-1);document.querySelector('#lbNext').onclick=()=>step(1);document.querySelector('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});document.addEventListener('keydown',e=>{if(!document.querySelector('#lightbox').classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});let touchX=null;document.querySelector('#lbImg').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});document.querySelector('#lbImg').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)step(dx>0?-1:1);touchX=null},{passive:true});
</script></body></html>
